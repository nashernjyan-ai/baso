name: Basoka AI CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Code Quality & Type Check
        run: npm run lint

      - name: Run Core System Tests
        run: npm run test

      - name: Build Web & Production Server
        run: npm run build
        env:
          NODE_ENV: production
